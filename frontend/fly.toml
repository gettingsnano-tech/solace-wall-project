# fly.toml app configuration file generated for solace-wall-project-frontend on 2026-07-01T19:33:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'solace-wall-project-frontend'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    NEXT_PUBLIC_API_URL = 'https://solace-wall-project.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
